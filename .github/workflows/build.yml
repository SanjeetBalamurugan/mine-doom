name: MineDoom Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Natives & Mod JARs (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Base Linux dependencies
      - name: Run scripts/linux.sh
        run: |
          chmod +x scripts/linux.sh
          ./scripts/linux.sh

      # 2. Cross-compilation toolchains
      - name: Run scripts/install-toolchains.sh
        run: |
          chmod +x scripts/install-toolchains.sh
          ./scripts/install-toolchains.sh

      # 3. CMake 4.2. Runs after the scripts above so it takes precedence on PATH
      #    over any apt-installed CMake.
      - name: Set up CMake 4.2
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.x'

      - name: Verify CMake Version
        run: cmake --version

      # 4. JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verify Java Version
        run: |
          java -version
          javac -version

      # 5. Native libraries for all platforms
      - name: Run scripts/build-all.sh
        run: |
          export SDKMAN_DIR="$HOME/.sdkman"
          source "$HOME/.sdkman/bin/sdkman-init.sh" || true
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh

      # 6. Mod JARs
      - name: Run gradlew build
        run: |
          export SDKMAN_DIR="$HOME/.sdkman"
          source "$HOME/.sdkman/bin/sdkman-init.sh" || true
          chmod +x gradlew
          ./gradlew build --no-daemon

      # 7. Stage both JARs and compute checksums
      - name: Stage Both JARs & Print Checksums
        id: jars
        run: |
          mkdir -p dist/main dist/sources

          MAIN_JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | sort | head -n 1)
          SECOND_JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -path "$MAIN_JAR" | sort | head -n 1)

          if [ -z "$MAIN_JAR" ] || [ -z "$SECOND_JAR" ]; then
            echo "Error: Expected two JARs in build/libs, found:"
            ls -la build/libs
            exit 1
          fi

          MAIN_NAME=$(basename "$MAIN_JAR")
          SECOND_NAME=$(basename "$SECOND_JAR")

          cp "$MAIN_JAR" "dist/main/$MAIN_NAME"
          cp "$SECOND_JAR" "dist/sources/$SECOND_NAME"
          cp "$MAIN_JAR" "$SECOND_JAR" dist/

          cd dist
          sha256sum "$MAIN_NAME" "$SECOND_NAME" | tee SHA256SUMS.txt
          sha512sum "$MAIN_NAME" "$SECOND_NAME" | tee SHA512SUMS.txt

          echo "main_name=$MAIN_NAME" >> "$GITHUB_OUTPUT"
          echo "second_name=$SECOND_NAME" >> "$GITHUB_OUTPUT"

      # 8. Upload each JAR as its own downloadable artifact
      - name: Upload Main Mod JAR
        id: upload_main
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jars.outputs.main_name }}
          path: dist/main/${{ steps.jars.outputs.main_name }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload Second JAR (Sources / Dev)
        id: upload_second
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jars.outputs.second_name }}
          path: dist/sources/${{ steps.jars.outputs.second_name }}
          if-no-files-found: error
          retention-days: 90

      # 9. Download links and checksums in the log and the job summary
      - name: Print Download Links & Checksums
        if: success()
        run: |
          echo "1. ${{ steps.jars.outputs.main_name }}:"
          echo "   ${{ steps.upload_main.outputs.artifact-url }}"
          echo "2. ${{ steps.jars.outputs.second_name }}:"
          echo "   ${{ steps.upload_second.outputs.artifact-url }}"
          echo ""
          cat dist/SHA256SUMS.txt
          echo ""
          cat dist/SHA512SUMS.txt

          {
            echo "## MineDoom Build Artifacts & Checksums"
            echo ""
            echo "### Downloadable Links"
            echo "- **[Download \`${{ steps.jars.outputs.main_name }}\`](${{ steps.upload_main.outputs.artifact-url }})**"
            echo "- **[Download \`${{ steps.jars.outputs.second_name }}\`](${{ steps.upload_second.outputs.artifact-url }})**"
            echo ""
            echo "### SHA-256 Checksums"
            echo "\`\`\`text"
            cat dist/SHA256SUMS.txt
            echo "\`\`\`"
            echo ""
            echo "### SHA-512 Checksums"
            echo "\`\`\`text"
            cat dist/SHA512SUMS.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
